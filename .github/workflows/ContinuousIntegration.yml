name: Continuous Integration

on:
  push:
    branches: [ "main", "workflow-ci" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore TwoSum/TwoSum.csproj

    - name: Build
      run: dotnet build TwoSum/TwoSum.csproj --configuration Release

    - name: Run tests
      run: dotnet test TwoSumTests/TwoSumTests.csproj --no-build --verbosity normal

    - name: Notify Discord
      if: always() 
      run: |
        curl -H "Content-Type: application/json" \
             -d "{\"content\": \" Build e testes concluídos para branch $GITHUB_REF\"}" \
             ${{ secrets.DISCORD_WEBHOOK }}
